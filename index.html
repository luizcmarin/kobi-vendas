<!doctype html>
<html lang="pt-BR" class="kk-theme-light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kobi Vendas</title>
  <meta name="description" content="O material de venda dos produtos Kobi para o parceiro revendedor: a apresentação, o
      folder, o site, o guia de venda e as mensagens prontas, com o seu nome e o seu WhatsApp." />
  <link rel="icon" href="./icons/kobi-vendas.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/kobi-vendas-apple-touch-icon.png" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    (() => {
      const erros = [];
      let mostrada = false;
      const anotar = (texto) => {
        if (erros.length < 6) erros.push(String(texto).slice(0, 800));
      };
      const descrever = (motivo) =>
        motivo instanceof Error
          ? `${motivo.name}: ${motivo.message}\n${motivo.stack ?? ''}`.trim()
          : String(motivo);

      addEventListener(
        'error',
        (evento) => {
          const alvo = evento.target;
          if (evento instanceof ErrorEvent) {
            anotar(`${descrever(evento.error ?? evento.message)} (${evento.filename}:${evento.lineno})`);
          } else if (alvo instanceof HTMLScriptElement && alvo.src) {
            anotar(`não carregou: ${alvo.src}`);
          } else if (alvo instanceof HTMLLinkElement && alvo.href) {
            anotar(`não carregou: ${alvo.href}`);
          }
        },
        true,
      );
      addEventListener('unhandledrejection', (evento) => anotar(descrever(evento.reason)));

      const mostrar = (forcada) => {
        const app = document.getElementById('app');
        if (mostrada || app === null || (!forcada && app.firstElementChild !== null)) return;
        mostrada = true;

        const caixa = document.createElement('div');
        caixa.className = 'aviso';
        caixa.setAttribute('role', 'alert');
        caixa.innerHTML = `
          <h2>O Kobi Vendas não abriu</h2>
          <p>Alguma coisa impediu o aplicativo de começar. Os seus dados continuam no aparelho.</p>
          <p>Tente de novo. Se esta tela voltar, mande uma captura dela a quem cuida do app.</p>
          <pre class="detalhe"></pre>
          <p>
            <button type="button" data-acao="recarregar">Tentar de novo</button>
            <button type="button" data-acao="limpar">Recarregar sem o cache</button>
          </p>
        `;
        caixa.querySelector('.detalhe').textContent = [
          erros.length > 0 ? erros.join('\n\n') : 'O aplicativo não respondeu em 20 segundos.',
          navigator.userAgent,
          location.href,
        ].join('\n\n');
        caixa.querySelector('[data-acao="recarregar"]').addEventListener('click', () => {
          location.reload();
        });
        // A cópia do aplicativo (o service worker e o que ele guardou), só a deste app.
        caixa.querySelector('[data-acao="limpar"]').addEventListener('click', async () => {
          try {
            const escopo = new URL('./', location.href).href;
            const registros = (await navigator.serviceWorker?.getRegistrations?.()) ?? [];
            await Promise.all(
              registros.filter((r) => r.scope === escopo).map((r) => r.unregister()),
            );
            const doApp = (nome) =>
              nome.startsWith('vendas-') || nome.endsWith(`-${escopo}`);
            const nomes = (await globalThis.caches?.keys()) ?? [];
            await Promise.all(nomes.filter(doApp).map((nome) => caches.delete(nome)));
          } finally {
            location.reload();
          }
        });

        if (forcada) app.hidden = true;
        document.body.append(caixa);
      };

      window.__falhaDaAbertura = (erro) => {
        anotar(descrever(erro));
        mostrar(true);
      };
      addEventListener('load', () => {
        if (erros.length > 0) setTimeout(() => mostrar(false), 1000);
      });
      setTimeout(() => mostrar(false), 20000);
    })();
  </script>
  <script>
    (() => {
      const salvo = localStorage.getItem('vendas_tema');
      const escuro =
        salvo === 'escuro' ||
        (salvo === null && matchMedia('(prefers-color-scheme: dark)').matches);
      const raiz = document.documentElement.classList;
      raiz.toggle('kk-theme-dark', escuro);
      raiz.toggle('kk-theme-light', !escuro);
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', escuro ? '#0f1115' : '#ffffff');
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-C51UGKj1.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bh_P4eiP.css">
<link rel="manifest" href="./manifest.webmanifest"></head>

<body>
  <div id="app" aria-busy="true"></div>
</body>

</html>

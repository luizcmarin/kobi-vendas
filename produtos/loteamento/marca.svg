<?xml version="1.0" encoding="UTF-8"?>
<!-- A marca do Kobi Loteamento, irmã das do Kobi Imobiliária, do Kobi Pousada, do Kobi RH, do Kobi Náutica e do Kobi Oficina:
     o mesmo K no azul da marca kobi-kubo, numa caixa quadrada para servir de ícone. A haste de cima e a diagonal são as dos
     irmãos; no lugar da perna de baixo, o terreno visto em perspectiva, repartido em seis lotes pelas ruas, e o alfinete do
     mapa cravado no lote da frente, o que está à venda (até 18/11/2026 era o marco de divisa, que não se lia como loteamento).
     O movimento (a cada 8 s o alfinete cai sobre o lote e quica) começa e termina na marca parada: o quadro zero é o que o
     favicon e o .ico mostram. Quem pede menos movimento vê a marca parada, e o endereço com #parada também (o :target). -->
<svg id="parada" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656.5 656.5" width="656" height="656">
  <title>Kobi Loteamento</title>
  <style>
    .alfinete { animation: cair 8s infinite; }
    @keyframes cair {
      0%, 4% { transform: translate(0, 0); animation-timing-function: ease-in; }
      8% { transform: translate(0, -70px); animation-timing-function: ease-in; }
      12% { transform: translate(0, 0); animation-timing-function: ease-out; }
      15% { transform: translate(0, -22px); animation-timing-function: ease-in; }
      18%, 100% { transform: translate(0, 0); }
    }
    #parada:target .alfinete { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .alfinete { animation: none; }
    }
  </style>
  <defs>
    <!-- O vão em volta do alfinete, recortado nos lotes de trás; a ponta se crava no lote da frente. -->
    <mask id="vao" maskUnits="userSpaceOnUse" x="0" y="0" width="656.5" height="600">
      <rect x="0" y="0" width="656.5" height="600" fill="#fff" />
      <path d="M446,500 L386.1,340.5 A64,64 0 1 1 505.9,340.5 Z" fill="#000" stroke="#000" stroke-width="40" stroke-linejoin="round" />
    </mask>
  </defs>
  <g fill="#007cdc" transform="translate(0 59.25)">
    <path d="M0,0 H148.5 l6.62,3.14 c19.71,9.34 26.71,25.87 22.8,53.93 c-2.5,17.95 -12.08,41.18 -23.06,55.93 c-2.87,3.85 -38.88,40.75 -80.03,82 L0,270.5 Z" />
    <path d="M30.75,537 c-13.44,-3.4 -24.18,-13.42 -28.68,-26.78 C0.05,504.22 0,502.32 0,422.8 V341.5 L341.5,0 H594.5 L328,266.4 C67.78,526.5 61.36,532.84 55.5,535 c-6.75,2.48 -18.94,3.46 -24.75,2 Z" />
    <path d="M196,538 L334,538 L386.2,465 L274,465 Z" />
    <path d="M357,538 L495,538 L517.1,465 L404.9,465 Z" />
    <path d="M518,538 L656,538 L648,465 L535.8,465 Z" />
    <g mask="url(#vao)">
      <path d="M294.3,446 L399.8,446 L438.4,392 L352,392 Z" />
      <path d="M417.4,446 L522.8,446 L539.2,392 L452.8,392 Z" />
      <path d="M540.4,446 L645.9,446 L640,392 L553.6,392 Z" />
    </g>
    <path class="alfinete" fill-rule="evenodd" d="M446,500 L386.1,340.5 A64,64 0 1 1 505.9,340.5 Z M446,294 a24,24 0 1 0 0,48 a24,24 0 1 0 0,-48 Z" />
  </g>
</svg>

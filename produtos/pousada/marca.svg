<?xml version="1.0" encoding="UTF-8"?>
<!-- A marca do Kobi Pousada, irmã da do Kobi Imobiliária: o mesmo K no azul da marca kobi-kubo, numa caixa
     quadrada para servir de ícone. A haste de cima e a diagonal são as do imob; a perna de baixo, que lá
     é um telhado, aqui é o sol nascendo na linha do mar. O movimento (a cada 8 s o sol afunda e torna a
     nascer, e o resto do K corre no sentido da diagonal) começa e termina na marca parada: o quadro zero
     é o que o favicon e o .ico mostram (pousada/marca/). Quem pede menos movimento vê a marca parada, e o
     endereço com #parada também (o :target; o painel das telas de conta pede). -->
<svg id="parada" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656.5 656.5" width="656" height="656">
  <title>Kobi Pousada</title>
  <style>
    .haste, .diagonal { animation: correr 8s ease-in-out infinite; }
    .sol { animation: nascer 8s infinite; }
    @keyframes correr {
      0%, 4%, 18%, 100% { transform: translate(0, 0); }
      11% { transform: translate(18px, -18px); }
    }
    @keyframes nascer {
      0%, 4% { transform: translate(0, 0); animation-timing-function: ease-in; }
      10% { transform: translate(0, 46px); animation-timing-function: ease-out; }
      20%, 100% { transform: translate(0, 0); }
    }
    #parada:target :is(.haste, .diagonal, .sol) { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .haste, .diagonal, .sol { animation: none; }
    }
  </style>
  <g fill="#007cdc" transform="translate(0 59.25)">
    <path class="haste" d="M0,0 H148.5 l6.62,3.14 c19.71,9.34 26.71,25.87 22.8,53.93 c-2.5,17.95 -12.08,41.18 -23.06,55.93 c-2.87,3.85 -38.88,40.75 -80.03,82 L0,270.5 Z" />
    <path class="diagonal" d="M30.75,537 c-13.44,-3.4 -24.18,-13.42 -28.68,-26.78 C0.05,504.22 0,502.32 0,422.8 V341.5 L341.5,0 H594.5 L328,266.4 C67.78,526.5 61.36,532.84 55.5,535 c-6.75,2.48 -18.94,3.46 -24.75,2 Z" />
    <path class="sol" d="M236.5,538 A210,210 0 0 1 656.5,538 Z" />
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- A marca do Kobi Corretor, irmã das marcas do Kobi Go (apps/kobigo/marca/): o mesmo K no azul da marca kobi-kubo, numa
     caixa quadrada para servir de ícone. A haste de cima e a diagonal são as dos irmãos; no lugar da perna de baixo, a praia
     da temporada: o guarda-sol fincado na areia (até 19/11/2026 era a casa com a fechadura e o mar, fora do padrão sem o K).
     O movimento (a cada 8 s o guarda-sol balança na brisa e para) começa e termina na marca parada: o quadro zero é o que os
     PNG mostram (`bun run icones:corretor`). Quem pede menos movimento vê a marca parada, e o endereço com #parada também. -->
<svg id="parada" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656.5 656.5" width="656" height="656" role="img">
  <title>Kobi Corretor</title>
  <style>
    .guarda-sol { transform-origin: 451px 500px; animation: brisa 8s infinite; }
    @keyframes brisa {
      0%, 4% { transform: rotate(0deg); animation-timing-function: ease-in-out; }
      9% { transform: rotate(-6deg); animation-timing-function: ease-in-out; }
      14% { transform: rotate(4deg); animation-timing-function: ease-in-out; }
      18% { transform: rotate(-2deg); animation-timing-function: ease-in-out; }
      21%, 100% { transform: rotate(0deg); }
    }
    #parada:target .guarda-sol { animation: none; }
    @media (prefers-reduced-motion: reduce) {
      .guarda-sol { animation: none; }
    }
  </style>
  <g fill="#007cdc" transform="translate(0 59.25)">
    <path d="M0,0 H148.5 l6.62,3.14 c19.71,9.34 26.71,25.87 22.8,53.93 c-2.5,17.95 -12.08,41.18 -23.06,55.93 c-2.87,3.85 -38.88,40.75 -80.03,82 L0,270.5 Z" />
    <path d="M30.75,537 c-13.44,-3.4 -24.18,-13.42 -28.68,-26.78 C0.05,504.22 0,502.32 0,422.8 V341.5 L341.5,0 H594.5 L328,266.4 C67.78,526.5 61.36,532.84 55.5,535 c-6.75,2.48 -18.94,3.46 -24.75,2 Z" />
    <!-- A areia: a duna baixa que fecha o pé do K, da largura da perna dos irmãos. -->
    <path d="M196,538 Q330,466 456,488 T656,470 V538 Z" />
    <g class="guarda-sol">
      <!-- A lona: a cúpula com a barra recortada em três gomos. -->
      <path d="M266,412 A194,146 0 0 1 654,412 a64.67,30 0 0 0 -129.33,0 a64.67,30 0 0 0 -129.34,0 a64.67,30 0 0 0 -129.33,0 Z" />
      <!-- O mastro, um pouco inclinado, cravado na areia. -->
      <path d="M444,404 H478 L468,504 H434 Z" />
      <!-- A ponta de cima. -->
      <circle cx="460" cy="264" r="20" />
    </g>
  </g>
</svg>
